<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MERCADO DE SECRETOS</title>
  <!-- Importamos 98.css directamente -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #008080; padding: 20px;">

  <!-- Ventana retro de Windows 98 -->
  <div class="window" style="width: 320px; margin: 0 auto;">
    <div class="title-bar">
      <div class="title-bar-text">Mercado de Secretos - Inicio de Sesión</div>
      <div class="title-bar-controls">
        <button aria-label="Minimize"></button>
        <button aria-label="Maximize"></button>
        <button aria-label="Close"></button>
      </div>
    </div>
    <div class="window-body">
      <p>Bienvenido al Mercado de Secretos.</p>
      
      <div class="field-row-stacked" style="width: 200px">
        <label for="text22">Usuario:</label>
        <input id="text22" type="text" />
      </div>
      
      <div class="field-row-stacked" style="width: 200px; margin-top: 8px;">
        <label for="text23">Contraseña:</label>
        <input id="text23" type="password" />
      </div>

      <section class="field-row" style="justify-content: flex-end; margin-top: 15px;">
        <button>Ingresar</button>
      </section>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
