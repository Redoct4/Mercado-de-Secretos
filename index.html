<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mercado de Secretos</title>
  <!-- Importamos 98.css directamente -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="general-style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="window screen-window">
    <div class="title-bar">
      <div class="title-bar-text">MERCADO DE SECRETOS - Inicio</div>
    </div>

    <div class="window-body">

      <div class="seccion-superior">
        <h1>MERCADO DE SECRETOS</h1>
        <p class="subtitulo">¡Bienvenido al intercambio de secretos anónimo!</p>
      </div>
      
      <div class = "seccion-central">
        <div class="caja-login">
          <p class="instruccion">Ingresa o crea una cuenta con un usuario y contraseña.</p>

          <div class="texto">
            <label for="user">Usuario:</label>
            <input id="user" type="text"/>
          </div>

          <div class="texto">
            <label for="password">Contraseña:</label>
            <input id="password" type="password"/>
          </div>
        </div>

      </div>

      <div class="seccion-inferior">
        <button id="loginButton">Iniciar Sesión</button>
        <button id="registerButton">Registrarse</button>
      </div>
    
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
