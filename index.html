<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mercado de Secretos</title>
  <!-- Importamos 98.css directamente -->
  <link rel="stylesheet" href="node_modules/98.css/dist/98.css">
  <link rel="stylesheet" href="general-style.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="window screen-window">
    <div class="title-bar">
      <div class="title-bar-text">MERCADO DE SECRETOS / Inicio</div>
    </div>

    <div class="window-body">

      <div class="seccion-superior">
        <div class="h1-title">
          <img src="imgs/envelope_open_sheet.png" class="home-title-icon">
          <h1>MERCADO DE SECRETOS</h1>
          <img src="imgs/envelope_open_sheet.png" class="home-title-icon">
        </div>
        <p class="subtitulo">¡Bienvenido al intercambio de secretos anónimo!</p>
      </div>
      
      <div class = "seccion-central">
        <div class="caja-login">
          <p class="texto">Ingresa o crea una cuenta con un usuario y contraseña.</p>

          <div class="user-password">
            <div class="textbox">
              <label for="user">Usuario:</label>
              <input id="user" type="text"/>
            </div>

            <div class="textbox">
              <label for="password">Contraseña:</label>
              <input id="password" type="password"/>
            </div>
          </div>
          

          <div class="checkbox">
            <input type="checkbox" id="TyC"/>
            <label for="TyC">Acepto los Términos y Condiciones</label>
          </div>

        </div>

      </div>

      <div class="seccion-inferior">
        <div class="button-column">
          <button class="b1" id="entrar">Entrar</button>
          <button class="b3" id="info-inicio">¿Qué es esto?</button>
        </div>
      </div>
    
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
