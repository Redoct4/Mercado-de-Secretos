<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>MERCADO DE SECRETOS</title>
  <!-- Importamos 98.css directamente -->
  <link rel="stylesheet" href="https://unpkg.com/98.css">
  <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #008080; padding: 20px;">

  <div class="window" style="width:100%; height:100%; margin:0px auto; ">
    <div class="title-bar">
      <div class="title-bar-text">MERCADO DE SECRETOS - Inicio</div>
    </div>
    <div class="window-body">
      <h1 class="tit";>MERCADO DE SECRETOS</h1>
      <p class="subtitulo">¡Bienvenido al intercambio de secretos anónimo!</p>
      
      <div class="caja-login">
        <p class="instruccion">Ingresa o crea una cuenta con un usuario y contraseña.</p>

        <div class="texto">
          <label for="user">Usuario:</label>
          <input id="user" type="text"/>
        </div>

        <div class="texto">
          <label for="password">Contraseña:</label>
          <input id="password" type="password"/>
        </div>
      </div>
    
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
